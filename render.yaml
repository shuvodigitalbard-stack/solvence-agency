services:
  - type: web
    name: solvence-agency
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    plan: free
