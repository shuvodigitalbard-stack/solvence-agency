<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmes Avatar | Download</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a2e;
            --primary: #4ade80;
            --primary-dark: #22c55e;
            --secondary: #fbbf24;
            --accent: #2dd4bf;
            --text: #e4e4e7;
            --text-muted: #9ca3af;
            --border: #2a2a3e;
            --gradient-text: linear-gradient(135deg, #4ade80 0%, #2dd4bf 50%, #fbbf24 100%);
            --gradient-btn: linear-gradient(135deg, #4ade80 0%, #2dd4bf 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background effects */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .glow-orb-1 {
            width: 400px; height: 400px;
            background: rgba(74,222,128,0.08);
            top: -100px; left: -100px;
        }

        .glow-orb-2 {
            width: 300px; height: 300px;
            background: rgba(251,191,36,0.06);
            bottom: -50px; right: -50px;
        }

        .glow-orb-3 {
            width: 250px; height: 250px;
            background: rgba(45,212,191,0.06);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        /* Title */
        .title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        /* Image card */
        .image-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .image-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(74,222,128,0.3), rgba(45,212,191,0.1), rgba(251,191,36,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .image-card:hover {
            border-color: rgba(74,222,128,0.3);
            box-shadow: 0 0 40px rgba(74,222,128,0.1);
        }

        .image-card img {
            width: 100%;
            max-width: 360px;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .image-label {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Download button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0a0a0a;
            background: var(--gradient-btn);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(74,222,128,0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(74,222,128,0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Footer */
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float-particle 8s ease-in-out infinite;
        }

        @keyframes float-particle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.4; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-30px) translateX(5px); opacity: 0.6; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .title { font-size: 1.8rem; }
            .image-card { padding: 1.5rem; }
            .image-card img { max-width: 280px; }
            .download-btn { padding: 0.9rem 2rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <!-- Floating particles -->
    <div class="particle" style="top:15%;left:10%;background:#4ade80;animation-delay:0s"></div>
    <div class="particle" style="top:25%;right:15%;background:#fbbf24;animation-delay:1s"></div>
    <div class="particle" style="bottom:30%;left:20%;background:#2dd4bf;animation-delay:2s"></div>
    <div class="particle" style="top:60%;right:10%;background:#4ade80;animation-delay:3s"></div>
    <div class="particle" style="bottom:15%;left:40%;background:#fbbf24;animation-delay:4s"></div>
    <div class="particle" style="top:40%;left:5%;background:#2dd4bf;animation-delay:5s"></div>

    <!-- Main content -->
    <div class="container">
        <h1 class="title">Harmes Avatar</h1>
        <p class="subtitle">Telegram DP • Cyber Owl Design • 512×512px</p>

        <div class="image-card">
            <img src="harmes-dp.png" alt="Harmes Cyber Owl Avatar" id="avatar-img">
            <p class="image-label">🦉 Cyber Owl — Dark Navy • Gold Eyes • Teal Accents</p>
        </div>

        <a href="harmes-dp.png" download="harmes-dp.png" class="download-btn" id="download-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Avatar
        </a>

        <p class="footer">
            Made with 💚 by <a href="#">Harmes</a>
        </p>
    </div>

    <script>
        // Download button click effect
        const btn = document.getElementById('download-btn');
        btn.addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'translateY(-2px)';
            }, 150);
        });

        // Image load animation
        const img = document.getElementById('avatar-img');
        img.style.opacity = '0';
        img.style.transform = 'scale(0.9)';
        img.style.transition = 'all 0.6s ease';
        img.onload = () => {
            img.style.opacity = '1';
            img.style.transform = 'scale(1)';
        };
        // Trigger if already loaded
        if (img.complete) {
            img.style.opacity = '1';
            img.style.transform = 'scale(1)';
        }
    </script>
</body>
</html>
